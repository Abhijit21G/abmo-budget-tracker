<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#193d32"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AbMo Budget"><link rel="manifest" href="manifest.json"><title>AbMo Budget Tracker</title><style>
:root{--g:#193d32;--g2:#47795d;--bg:#f5f5f1;--ink:#20352b;--muted:#788279;--line:#e6e9e1;--white:#fff;--red:#a64d35}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(30px + env(safe-area-inset-bottom))}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:650px;margin:auto;padding:20px 16px}.brand{display:flex;align-items:center;gap:12px;margin:6px 0 22px}.logo{width:45px;height:45px;border-radius:14px;background:var(--g);color:white;display:grid;place-items:center;font-size:23px}.brand b{font-size:22px;color:var(--g)}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.4px;margin-top:3px}.panel{background:white;border-radius:19px;padding:18px;margin:13px 0;box-shadow:0 3px 14px #193d3207}.hero{background:var(--g);color:white;border-radius:22px;padding:22px;margin:14px 0}.muted{color:var(--muted);font-size:12px}.hero .muted{color:#d5e4da}.balance{font-size:34px;font-weight:800;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:700;color:#56645a}.field input,.field select{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fafbf8;width:100%;color:var(--ink)}.primary,.secondary,.danger{border:0;border-radius:13px;padding:13px 15px;font-weight:700}.primary{background:var(--g);color:white;width:100%}.secondary{background:#e7eee6;color:var(--g)}.danger{background:#f8e9e2;color:var(--red)}h1{font-size:24px;color:var(--g);margin:6px 0}h2{font-size:17px;margin:0 0 12px;color:var(--g)}.notice{font-size:12px;line-height:1.5;color:var(--muted);margin-top:12px}.status{background:#e7eee6;color:var(--g);border-radius:11px;padding:10px;font-size:12px;margin:10px 0}.tx{padding:13px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}.tx:last-child{border-bottom:0}.txmain{flex:1;min-width:0}.txname{font-weight:700;font-size:14px;overflow-wrap:anywhere}.txmeta{font-size:11px;color:var(--muted);margin-top:4px}.amt{font-weight:750;white-space:nowrap;font-size:13px}.pill{font-size:10px;border-radius:20px;background:#e7eee6;color:var(--g);padding:4px 7px;margin-left:5px}.personal{background:#f8ead9;color:#8a5b22}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.hidden{display:none!important}.divider{height:1px;background:var(--line);margin:16px 0}a{color:var(--g2);overflow-wrap:anywhere}button:disabled{opacity:.5}@media(min-width:520px){.app{padding:25px}.balance{font-size:40px}}
</style></head><body><div class="app"><header class="brand"><div class="logo">⌂</div><div><b>AbMo Budget Tracker</b><small>YOUR HOME & MONEY</small></div></header><main id="app"><section class="panel"><h1>Shared household budget</h1><p class="muted">Loading secure sign-in…</p></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script>
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'}).format(Number(n)||0), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LOCAL_KEY='abMoBudgetTrackerDataV1';let sb=null,user=null,household=null,settings={monthly_income:0,opening_savings:0,budgets:{Housing:2200,Groceries:650,Utilities:300,Transport:300,Lifestyle:400}},transactions=[],tab='Home',editId=null;
function notice(t){let n=$('#notice');if(n)n.textContent=t;else alert(t)}
function configured(){return window.ABMO_CONFIG&&ABMO_CONFIG.SUPABASE_URL.startsWith('https://')&& !ABMO_CONFIG.SUPABASE_URL.includes('PASTE_')&&ABMO_CONFIG.SUPABASE_ANON_KEY&&!ABMO_CONFIG.SUPABASE_ANON_KEY.includes('PASTE_')}
function inviteFromUrl(){return new URLSearchParams(location.search).get('invite')||new URLSearchParams(location.hash.slice(1)).get('invite')}
function authView(msg=''){ $('#app').innerHTML=`<section class="panel"><h1>Sign in to AbMo</h1><p class="muted">Use your email to receive a secure sign-in link. No password to remember.</p>${msg?`<div class="status">${esc(msg)}</div>`:''}<form id="login"><div class="field"><label>Your email address</label><input type="email" name="email" autocomplete="email" required placeholder="you@example.com"></div><button class="primary">Email me a sign-in link</button></form><p class="notice">Your budget records are stored in a private Supabase project with database access rules. Only household members can access shared records.</p></section>`;$('#login').onsubmit=async e=>{e.preventDefault();let email=new FormData(e.currentTarget).get('email');let {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname+(inviteFromUrl()?'?invite='+encodeURIComponent(inviteFromUrl()):'')}});authView(error?error.message:'Check your email for the sign-in link, then return here.');}}
async function getHousehold(){let {data,error}=await sb.from('household_members').select('household_id,role').eq('user_id',user.id).maybeSingle();if(error)throw error;if(!data)return null;let {data:h,error:he}=await sb.from('households').select('id,name,invite_code').eq('id',data.household_id).single();if(he)throw he;return {...h,role:data.role}}
function setupView(msg=''){let inv=inviteFromUrl();$('#app').innerHTML=`<section class="panel"><h1>Set up your household</h1><p class="muted">You're signed in as ${esc(user.email)}. Create a household budget or join one using a private invitation link.</p>${msg?`<div class="status">${esc(msg)}</div>`:''}${inv?`<div class="status">An invitation was detected. Tap “Join invited household” to continue.</div><button class="primary" id="join">Join invited household</button><div class="divider"></div>`:''}<form id="create"><div class="field"><label>Household name</label><input name="name" value="Our Home Budget" maxlength="70" required></div><button class="primary">Create a new household</button></form><p class="notice">Create a household only if you're the first person setting it up. The second person should open your invitation link instead.</p><button class="secondary" id="signout">Sign out</button></section>`;$('#create').onsubmit=async e=>{e.preventDefault();let name=new FormData(e.currentTarget).get('name');let {data,error}=await sb.rpc('create_household',{household_name:name});if(error)return setupView(error.message);await loadHousehold();};let j=$('#join');if(j)j.onclick=async()=>{let {data,error}=await sb.rpc('join_household',{code:inv});if(error)return setupView(error.message);history.replaceState({},'',location.pathname);await loadHousehold()};$('#signout').onclick=()=>sb.auth.signOut().then(()=>authView());}
async function loadHousehold(){try{household=await getHousehold();if(!household){setupView();return}let [{data:s,error:se},{data:t,error:te}]=await Promise.all([sb.from('household_settings').select('*').eq('household_id',household.id).single(),sb.from('transactions').select('*').eq('household_id',household.id).order('date',{ascending:false})]);if(se)throw se;if(te)throw te;settings=s;transactions=t||[];await migrateLegacy();render()}catch(e){$('#app').innerHTML=`<section class="panel"><h1>Couldn't load budget</h1><div class="status">${esc(e.message||e)}</div><button class="secondary" onclick="location.reload()">Try again</button></section>`}}
async function migrateLegacy(){let raw=localStorage.getItem(LOCAL_KEY);if(!raw||localStorage.getItem('abmoCloudMigrationDone'))return;let old;try{old=JSON.parse(raw)}catch{return}if(!old||!Array.isArray(old.transactions))return;$('#app').innerHTML=`<section class="panel"><h1>Bring your existing records?</h1><p class="muted">We found ${old.transactions.length} transactions saved on this device. They have not been changed or deleted.</p><p class="notice">Choose whether to import them as shared household records (visible to both people) or personal records (visible only to you). You can change visibility later.</p><div class="field"><label>Import existing transactions as</label><select id="migrationScope"><option value="shared">Shared with household</option><option value="personal">Personal — only me</option></select></div><button class="primary" id="importOld">Import existing records</button><button class="secondary" id="skipImport" style="margin-top:10px;width:100%">Skip for now</button></section>`;$('#importOld').onclick=async()=>{let scope=$('#migrationScope').value;let payload=old.transactions.map(t=>({household_id:household.id,owner_id:user.id,name:String(t.name||'Imported transaction').slice(0,80),category:t.category||'Other',amount:Number(t.amount),date:t.date||new Date().toISOString().slice(0,10),kind:t.kind==='income'?'income':'expense',visibility:scope})).filter(t=>t.amount>0);let {error}=await sb.from('transactions').insert(payload);if(error){notice(error.message);return}let {error:se}=await sb.from('household_settings').update({monthly_income:Number(old.monthlyIncome)||0,opening_savings:Number(old.openingSavings)||0,budgets:old.budgets||settings.budgets,updated_at:new Date().toISOString()}).eq('household_id',household.id);if(se){notice(se.message);return}localStorage.setItem('abmoCloudMigrationDone','yes');await loadHousehold()};$('#skipImport').onclick=()=>{localStorage.setItem('abmoCloudMigrationDone','yes');render()};throw new Error('__migration_ui__')}
function visibleTx(){return transactions.filter(t=>t.visibility==='shared'||t.owner_id===user.id)}function savings(){return Number(settings.opening_savings||0)+visibleTx().reduce((sum,t)=>sum+(t.kind==='income'?1:-1)*Number(t.amount),0)}function thisMonth(){return new Date().toISOString().slice(0,7)}function monthTx(){return visibleTx().filter(t=>String(t.date).slice(0,7)===thisMonth())}function amount(t){return (t.kind==='income'?'+':'−')+money(t.amount)}
function txHTML(t){let editable=t.visibility==='shared'||t.owner_id===user.id;return `<div class="tx"><div class="txmain"><div class="txname">${esc(t.name)} <span class="pill ${t.visibility==='personal'?'personal':''}">${t.visibility==='shared'?'Shared':'Personal'}</span></div><div class="txmeta">${esc(t.category)} · ${esc(t.date)} · ${t.owner_id===user.id?'Added by you':'Added by household member'}</div></div><div class="amt">${amount(t)}<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">${editable?`<button class="secondary" data-edit="${t.id}" style="padding:5px 8px;font-size:11px">Edit</button><button class="danger" data-del="${t.id}" style="padding:5px 8px;font-size:11px">Delete</button>`:''}</div></div></div>`}
function render(){let all=visibleTx(),mt=monthTx(),inc=mt.filter(t=>t.kind==='income').reduce((s,t)=>s+Number(t.amount),0),exp=mt.filter(t=>t.kind==='expense').reduce((s,t)=>s+Number(t.amount),0),budgetTotal=Object.values(settings.budgets||{}).reduce((s,v)=>s+Number(v||0),0);$('#app').innerHTML=`<div class="row"><div><div class="muted">${esc(household.name)}</div><h1>${tab==='Home'?'Money overview':tab==='Activity'?'Transactions':tab==='Budget'?'Monthly budget':'Household'}</h1></div><button class="secondary" id="signout">Sign out</button></div><div class="status">Signed in as ${esc(user.email)} · Secure shared budget</div>${tab==='Home'?`<section class="hero"><div class="muted">Current savings estimate</div><div class="balance">${money(savings())}</div><div class="muted">Opening savings + visible income − visible expenses</div><div class="divider" style="background:#496357"></div><div class="grid"><div><div class="muted">Income this month</div><b>${money(inc)}</b></div><div><div class="muted">Expenses this month</div><b>${money(exp)}</b></div></div></section><section class="panel"><div class="row"><h2>Recent transactions</h2><button class="secondary" data-tab="Activity">Add / view</button></div>${all.slice(0,8).map(txHTML).join('')||'<p class="muted">No transactions yet.</p>'}</section>`:tab==='Activity'?`<section class="panel"><h2>${editId?'Edit transaction':'Add a transaction'}</h2><form id="txform"><div class="field"><label>Description</label><input name="name" required maxlength="80" placeholder="e.g. Groceries"></div><div class="grid"><div class="field"><label>Amount (AUD)</label><input name="amount" type="number" min="0.01" step="0.01" required placeholder="0.00"></div><div class="field"><label>Date</label><input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></div></div><div class="grid"><div class="field"><label>Type</label><select name="kind"><option value="expense">Expense</option><option value="income">Income</option></select></div><div class="field"><label>Category</label><select name="category">${['Housing','Groceries','Utilities','Transport','Lifestyle','Health','Entertainment','Shopping','Income','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="field"><label>Who can see it?</label><select name="visibility"><option value="shared">Shared household transaction</option><option value="personal">Personal — only visible to me</option></select></div><button class="primary">${editId?'Save changes':'＋ Add transaction'}</button>${editId?'<button type="button" id="cancelEdit" class="secondary" style="margin-top:8px;width:100%">Cancel edit</button>':''}</form></section><section class="panel"><div class="row"><h2>Visible transactions</h2><span class="muted">${all.length} total</span></div>${all.map(txHTML).join('')||'<p class="muted">No transactions recorded yet.</p>'}</section>`:tab==='Budget'?`<section class="panel"><h2>Household budget limits</h2><form id="budgetform">${Object.entries(settings.budgets||{}).map(([k,v])=>`<div class="field"><label>${esc(k)} monthly limit (AUD)</label><input type="number" min="0" step="10" name="${esc(k)}" value="${Number(v)}"></div>`).join('')}<button class="primary">Save shared budget</button></form><p class="notice">Budget limits are shared with both household members. Personal transactions are excluded from the shared household view for privacy.</p></section>`:`<section class="panel"><h2>Invite the second person</h2><p class="muted">Create a private invitation link. Only someone who signs in and opens this link can join your household.</p><button class="primary" id="invite">Create / refresh invitation link</button><div id="inviteResult"></div><p class="notice">Creating a new link invalidates the previous one. Share it privately.</p><div class="divider"></div><h2>Savings and income settings</h2><form id="settingsform"><div class="field"><label>Monthly income target (AUD)</label><input type="number" min="0" step="100" name="monthly_income" value="${Number(settings.monthly_income)||0}"></div><div class="field"><label>Opening savings (AUD)</label><input type="number" step="0.01" name="opening_savings" value="${Number(settings.opening_savings)||0}"></div><button class="primary">Save shared settings</button></form><p class="notice">Personal transactions are visible only to the person who added them. Shared transactions and budget settings are visible to both members.</p></section>`}<div class="grid" style="margin-top:15px"><button class="secondary" data-tab="Home">⌂ Home</button><button class="secondary" data-tab="Activity">↕ Activity</button><button class="secondary" data-tab="Budget">▤ Budget</button><button class="secondary" data-tab="Household">♧ Household</button></div>`;
$('#signout').onclick=()=>sb.auth.signOut();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;editId=null;render()});let tf=$('#txform');if(tf){tf.onsubmit=async e=>{e.preventDefault();let f=new FormData(tf),payload={household_id:household.id,owner_id:user.id,name:String(f.get('name')).trim(),amount:Number(f.get('amount')),date:f.get('date'),kind:f.get('kind'),category:f.get('category'),visibility:f.get('visibility'),updated_at:new Date().toISOString()};let q=editId?sb.from('transactions').update(payload).eq('id',editId):sb.from('transactions').insert(payload);let {error}=await q;if(error){alert(error.message);return}editId=null;await loadDataAndRender()};let c=$('#cancelEdit');if(c)c.onclick=()=>{editId=null;render()}}
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{let t=transactions.find(x=>x.id===b.dataset.edit);if(!t)return;editId=t.id;tab='Activity';render();let f=$('#txform');for(let [k,v] of Object.entries(t)){if(f.elements[k])f.elements[k].value=v}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this transaction?'))return;let {error}=await sb.from('transactions').delete().eq('id',b.dataset.del);if(error)alert(error.message);else await loadDataAndRender()});let bf=$('#budgetform');if(bf)bf.onsubmit=async e=>{e.preventDefault();let f=new FormData(bf),budgets={};for(let k of Object.keys(settings.budgets||{}))budgets[k]=Math.max(0,Number(f.get(k))||0);let {error}=await sb.from('household_settings').update({budgets,updated_at:new Date().toISOString()}).eq('household_id',household.id);if(error)alert(error.message);else await loadDataAndRender()};let sf=$('#settingsform');if(sf)sf.onsubmit=async e=>{e.preventDefault();let f=new FormData(sf);let {error}=await sb.from('household_settings').update({monthly_income:Number(f.get('monthly_income'))||0,opening_savings:Number(f.get('opening_savings'))||0,updated_at:new Date().toISOString()}).eq('household_id',household.id);if(error)alert(error.message);else await loadDataAndRender()};let ib=$('#invite');if(ib)ib.onclick=async()=>{let {data,error}=await sb.rpc('rotate_household_invite');if(error){alert(error.message);return}let link=location.origin+location.pathname+'?invite='+encodeURIComponent(data);$('#inviteResult').innerHTML=`<div class="field"><label>Private invitation link</label><input id="inviteLink" readonly value="${esc(link)}"></div><button class="secondary" id="copyInvite">Copy invitation link</button>`;$('#copyInvite').onclick=async()=>{try{await navigator.clipboard.writeText(link);$('#copyInvite').textContent='Copied!'}catch{$('#inviteLink').select();document.execCommand('copy');$('#copyInvite').textContent='Copied!'}}}}
async function loadDataAndRender(){let [{data:s,error:se},{data:t,error:te}]=await Promise.all([sb.from('household_settings').select('*').eq('household_id',household.id).single(),sb.from('transactions').select('*').eq('household_id',household.id).order('date',{ascending:false})]);if(se||te){alert((se||te).message);return}settings=s;transactions=t||[];render()}
async function start(){if(!configured()){$('#app').innerHTML=`<section class="panel"><h1>One-time setup needed</h1><p class="muted">This two-person version uses a free Supabase project for secure accounts and cloud sync.</p><ol><li>Create a project at <a href="https://supabase.com" target="_blank" rel="noreferrer">Supabase</a>.</li><li>Open SQL Editor and run all of <b>schema.sql</b> included in this ZIP.</li><li>In Project Settings → API, copy the Project URL and publishable/anon key into <b>config.js</b>.</li><li>Publish all files over HTTPS, then open the site.</li></ol><p class="notice">Never put a service-role key in this app. The public anon/publishable key is intended for browser use; database security comes from the SQL policies.</p></section>`;return}sb=window.supabase.createClient(ABMO_CONFIG.SUPABASE_URL,ABMO_CONFIG.SUPABASE_ANON_KEY);let {data:{session}}=await sb.auth.getSession();sb.auth.onAuthStateChange(async(event,session)=>{if(session){user=session.user;setTimeout(()=>loadHousehold(),0)}else{user=null;household=null;authView()}});if(!session){authView();return}user=session.user;await loadHousehold()}
// Catch the deliberate handoff used to show the local-data import screen without erasing local records.
const oldLoadHousehold=loadHousehold;
loadHousehold=async function(){try{household=await getHousehold();if(!household){setupView();return}let [{data:s,error:se},{data:t,error:te}]=await Promise.all([sb.from('household_settings').select('*').eq('household_id',household.id).single(),sb.from('transactions').select('*').eq('household_id',household.id).order('date',{ascending:false})]);if(se)throw se;if(te)throw te;settings=s;transactions=t||[];let raw=localStorage.getItem(LOCAL_KEY);if(raw&&!localStorage.getItem('abmoCloudMigrationDone')){let old;try{old=JSON.parse(raw)}catch{}if(old&&Array.isArray(old.transactions)){migrationView(old);return}}render()}catch(e){$('#app').innerHTML=`<section class="panel"><h1>Couldn't load budget</h1><div class="status">${esc(e.message||e)}</div><button class="secondary" onclick="location.reload()">Try again</button></section>`}};
function migrationView(old){$('#app').innerHTML=`<section class="panel"><h1>Bring your existing records?</h1><p class="muted">We found ${old.transactions.length} transactions saved on this device. Your local data remains untouched.</p><p class="notice">Choose how to import these records. Shared records can be seen by both household members; personal records are visible only to you.</p><div class="field"><label>Import existing transactions as</label><select id="migrationScope"><option value="shared">Shared with household</option><option value="personal">Personal — only me</option></select></div><button class="primary" id="importOld">Import existing records</button><button class="secondary" id="skipImport" style="margin-top:10px;width:100%">Skip for now</button></section>`;$('#importOld').onclick=async()=>{let scope=$('#migrationScope').value,payload=old.transactions.map(t=>({household_id:household.id,owner_id:user.id,name:String(t.name||'Imported transaction').slice(0,80),category:t.category||'Other',amount:Number(t.amount),date:t.date||new Date().toISOString().slice(0,10),kind:t.kind==='income'?'income':'expense',visibility:scope})).filter(t=>t.amount>0);let {error}=await sb.from('transactions').insert(payload);if(error){alert(error.message);return}let {error:se}=await sb.from('household_settings').update({monthly_income:Number(old.monthlyIncome)||0,opening_savings:Number(old.openingSavings)||0,budgets:old.budgets||settings.budgets,updated_at:new Date().toISOString()}).eq('household_id',household.id);if(se){alert(se.message);return}localStorage.setItem('abmoCloudMigrationDone','yes');await loadHousehold()};$('#skipImport').onclick=()=>{localStorage.setItem('abmoCloudMigrationDone','yes');render()}}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
start().catch(e=>{$('#app').innerHTML=`<section class="panel"><h1>Setup error</h1><div class="status">${esc(e.message||e)}</div></section>`});
</script></body></html>
